# Scrape config for the system-overview stack (docker-compose.yml).
#
# Prometheus runs on the host network, so every exporter is on 127.0.0.1 — no
# container→host boundary, no firewall in the way. The `nvidia_gpu` target is
# down unless you started the stack with `--profile gpu` (or run the GPU
# exporter natively); that is expected on machines without an NVIDIA card.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Host metrics (node-exporter, host network) — CPU, memory, disk, filesystem,
  # and per-device network. The `device` label is eno1/eth0 for Ethernet and
  # wlp*/wlan0 for Wifi.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # GPU metrics — nvidia_gpu_exporter parses `nvidia-smi`.
  - job_name: nvidia_gpu
    static_configs:
      - targets: ["127.0.0.1:9835"]
