[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Content that ships *with* LeSysBot rather than being fetched: the default
# tools, the default dashboards, the Prometheus/Grafana stack, and the
# marketplace catalog. Without this, `pip install lesysbot` produces a bot with
# no tools and no dashboards, and `lesysbot setup` only works from a git
# checkout (`--repo`).
#
# These are force-included rather than moved under `lesysbot/` because they are
# also the files people edit, link to from the docs, and copy out as examples —
# moving them would churn every doc link and the docs site's import map.
# `paths.bundled_dir()` resolves either layout, so a wheel and a checkout behave
# identically.
# The staging is done by hatch_build.py rather than a plain `force-include`,
# because force-include copies a directory literally and hatchling's `exclude`
# patterns do not apply to it — which would ship the packager's git-ignored
# `dashboard/.env`, and with it their Grafana admin password. See that file.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[project]
name = "lesysbot"
version = "0.1.0"
description = "A pluggable bot framework: local LLM + MCP tools + Slack/Telegram messaging"
readme = "README.md"
requires-python = ">=3.11"
# The CLI provider, the tool registry and `lesysbot tools`/`lesysbot setup` need
# only these. Chat platforms are extras: `__main__` imports each adapter lazily,
# so an install without them is fully functional.
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
# --provider telegram
telegram = [
    "python-telegram-bot[ext]>=21.0",
]
# --provider slack. slack-bolt does not declare aiohttp, but its async socket
# handler imports it — pin it here so the provider works on a fresh install.
slack = [
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9",
]
# Everything a user-facing install can offer — what scripts/install.{sh,ps1}
# install, so every option the setup wizard presents actually works.
all = [
    "lesysbot[telegram,slack]",
]
dev = [
    "lesysbot[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
lesysbot = "lesysbot.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than inherited: ruff's *default* rule set is not
# stable across releases (0.16 widened it from these four to a much broader
# selection), and CI installs whatever `ruff>=0.4` resolves to — so an
# unpinned selection means an upstream release can fail every matrix job
# without a line of our code changing. Widen this deliberately, not by
# upgrade drift.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
