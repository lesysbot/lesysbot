name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # LeSysBot targets Linux only, so the matrix is Python versions on Ubuntu.
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"   # dev pulls [all]: telegram, discord
      - name: Lint
        run: ruff check lesysbot/ tests/ tools/
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          lesysbot --help
          lesysbot tools list

  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Chat platforms are extras; the CLI, the tool registry and the
      # `tools`/`setup` subcommands must work without any of them.
      - name: Install without extras
        run: pip install .
      - name: Assert extras really are absent
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("telegram", "discord", "aiohttp"):
              assert u.find_spec(mod) is None, f"{mod} leaked into the base install"
          PY
      - name: CLI smoke test
        run: |
          lesysbot --help
          lesysbot tools list

  shell-lint:
    name: Shell script analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh monitoring/scripts/*.sh

  # The single check `main`'s branch ruleset requires. Requiring the matrix jobs
  # by name instead would wedge every PR on "Expected — waiting for status" the
  # moment the matrix changes (a dropped Python version, a renamed runner), since
  # the old check name never reports again. This name is stable, so the matrix
  # above stays free to change.
  ci-ok:
    name: CI OK
    if: always()   # must still run — and fail — when a dependency failed
    needs: [test, base-install, shell-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
