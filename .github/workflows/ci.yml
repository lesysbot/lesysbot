name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"   # dev pulls [all]: telegram, discord
      - name: Lint
        run: ruff check lesysbot/ tests/ tools/
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          lesysbot --help
          lesysbot chat --help
          lesysbot setup --help
          lesysbot list

  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Chat platforms are extras; the CLI, the tool registry and the
      # `tools`/`setup` subcommands must work without any of them.
      - name: Install without extras
        run: pip install .
      - name: Assert extras really are absent
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("telegram", "discord", "aiohttp"):
              assert u.find_spec(mod) is None, f"{mod} leaked into the base install"
          PY
      - name: CLI smoke test
        run: |
          lesysbot --help
          lesysbot chat --help
          lesysbot setup --help
          lesysbot list

  powershell-lint:
    name: PowerShell script analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path scripts/ -Severity Error -EnableExit

  shell-lint:
    name: Shell script analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh
      # install.sh is POSIX sh (it is piped to `| sh`, which is dash on
      # Debian/Ubuntu). Bashisms are reported as SC3xxx *warnings*, so the
      # error-only pass above cannot see a single one of them.
      - name: shellcheck (POSIX mode)
        run: shellcheck --shell=sh --severity=warning scripts/install.sh

  installer:
    name: Installer end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # No Ollama daemon and no multi-gigabyte model pull on a CI runner.
      LESYSBOT_SKIP_OLLAMA: "1"
      LESYSBOT_SKIP_DASHBOARD: "1"
      # The service and the shell rc files are the two things LESYSBOT_HOME and
      # --prefix do not relocate, so they are the two the runner must not gain.
      LESYSBOT_SKIP_SERVICE: "1"
      LESYSBOT_NO_MODIFY_PATH: "1"
      LESYSBOT_HOME: ${{ github.workspace }}/ci-home
    steps:
      - uses: actions/checkout@v4
      # Run from the checkout with no --ref, so the job tests *this* commit's
      # installer against *this* commit's package rather than whatever is on the
      # default branch. `< /dev/null` is the assertion that it never reads stdin.
      - name: Install
        run: |
          sh scripts/install.sh \
            --prefix "$RUNNER_TEMP/lesysbot-app" --bin-dir "$RUNNER_TEMP/bin" < /dev/null
      - name: It installed a working command
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          lesysbot --help
          lesysbot chat --help
          test -f "$LESYSBOT_HOME/config.yaml"
          grep -q 'provider: cli' "$LESYSBOT_HOME/config.yaml"
          test -d "$LESYSBOT_HOME/tools"
      - name: Re-running it is an idempotent upgrade
        run: |
          sh scripts/install.sh \
            --prefix "$RUNNER_TEMP/lesysbot-app" --bin-dir "$RUNNER_TEMP/bin" < /dev/null
          "$RUNNER_TEMP/bin/lesysbot" --help
      - name: A scripted Telegram install needs no terminal
        env:
          LESYSBOT_HOME: ${{ github.workspace }}/ci-home-tg
          LESYSBOT_SETUP_PROVIDER: telegram
          LESYSBOT_SETUP_TELEGRAM_TOKEN: "123456:fakeTokenForCiNotARealBotAtAll1"
          LESYSBOT_SETUP_TELEGRAM_ALLOWED_IDS: "42"
        run: |
          sh scripts/install.sh \
            --prefix "$RUNNER_TEMP/tg-app" --bin-dir "$RUNNER_TEMP/tg-bin" < /dev/null
          grep -q 'provider: telegram' "$LESYSBOT_HOME/config.yaml"
          grep -q 'allowed_user_ids: \[42\]' "$LESYSBOT_HOME/config.yaml"
      - name: Uninstall removes what it made and keeps the data
        run: |
          sh "$RUNNER_TEMP/lesysbot-app/install.sh" --uninstall \
            --prefix "$RUNNER_TEMP/lesysbot-app" --bin-dir "$RUNNER_TEMP/bin"
          test ! -e "$RUNNER_TEMP/bin/lesysbot"
          test ! -d "$RUNNER_TEMP/lesysbot-app/venv"
          test -f "$LESYSBOT_HOME/config.yaml"

  # The single check `main`'s branch ruleset requires. Requiring the matrix jobs
  # by name instead would wedge every PR on "Expected — waiting for status" the
  # moment the matrix changes (a dropped Python version, a renamed runner), since
  # the old check name never reports again. This name is stable, so the matrix
  # above stays free to change.
  ci-ok:
    name: CI OK
    if: always()   # must still run — and fail — when a dependency failed
    needs: [test, base-install, powershell-lint, shell-lint, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
